<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <h1>Webpage Archiver</h1>

    <div class="formats">
      <label class="format-option">
        <input type="checkbox" id="fmt-html" checked>
        <span class="format-label">HTML</span>
        <span class="format-desc">Single-file archive</span>
      </label>
      <label class="format-option">
        <input type="checkbox" id="fmt-markdown" checked>
        <span class="format-label">Markdown</span>
        <span class="format-desc">Clean article text</span>
      </label>
      <label class="format-option">
        <input type="checkbox" id="fmt-png" checked>
        <span class="format-label">PNG</span>
        <span class="format-desc">Full-page screenshot</span>
      </label>
      <label class="format-option">
        <input type="checkbox" id="fmt-pdf" checked>
        <span class="format-label">Screenshot PDF</span>
        <span class="format-desc">Image-based PDF</span>
      </label>
      <label class="format-option">
        <input type="checkbox" id="fmt-printpdf" checked>
        <span class="format-label">Print PDF</span>
        <span class="format-desc">Browser-rendered with selectable text</span>
      </label>
    </div>

    <button id="btn-archive" class="btn-primary">Archive</button>

    <div id="status" class="status hidden"></div>

    <div id="progress" class="progress hidden">
      <div id="progress-bar" class="progress-bar"></div>
    </div>

    <div id="results" class="results hidden"></div>

    <div class="footer">
      <a href="#" id="btn-options">Options</a>
      <span class="footer-sep" aria-hidden="true">&middot;</span>
      <a href="https://github.com/geoffmyers/webpage-archiver" target="_blank" rel="noopener noreferrer" class="gh-link">
        <svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true" focusable="false" fill="currentColor"><path d="M8 0c4.42 0 8 3.58 8 8a8.013 8.013 0 0 1-5.45 7.59c-.4.08-.55-.17-.55-.38 0-.27.01-1.13.01-2.2 0-.75-.25-1.23-.54-1.48 1.78-.2 3.65-.88 3.65-3.95 0-.88-.31-1.59-.82-2.15.08-.2.36-1.02-.08-2.12 0 0-.67-.22-2.2.82-.64-.18-1.32-.27-2-.27-.68 0-1.36.09-2 .27-1.53-1.03-2.2-.82-2.2-.82-.44 1.1-.16 1.92-.08 2.12-.51.56-.82 1.28-.82 2.15 0 3.06 1.86 3.75 3.64 3.95-.23.2-.44.55-.51 1.07-.46.21-1.61.55-2.33-.66-.15-.24-.6-.83-1.23-.82-.67.01-.27.38.01.53.34.19.73.9.82 1.13.16.45.68 1.31 2.69.94 0 .67.01 1.3.01 1.49 0 .21-.15.45-.55.38A7.995 7.995 0 0 1 0 8c0-4.42 3.58-8 8-8Z"></path></svg>
        View source on GitHub
      </a>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
