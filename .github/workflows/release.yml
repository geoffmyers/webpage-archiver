# Generated by the development repository's publishing tooling from the
# project's declared release artifacts. Edit them there; a change made only
# here is overwritten by the next publish.
#
# Every push to main builds the artifacts and publishes a release tagged
# v<version>, unless that version is already released: raise the version
# to cut a new one.
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  version:
    name: Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      new: ${{ steps.version.outputs.new }}
    steps:
      - uses: actions/checkout@v6
      - id: version
        name: Read the version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(jq -r .version manifest.json)"
          [ -n "$version" ] || { echo "no version found"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if gh release view "v$version" >/dev/null 2>&1; then
            echo "v$version is already released; raise the version to release again."
            echo "new=false" >> "$GITHUB_OUTPUT"
          else
            echo "new=true" >> "$GITHUB_OUTPUT"
          fi

  build-chrome-extension:
    name: Chrome extension
    needs: version
    if: needs.version.outputs.new == 'true'
    runs-on: ubuntu-latest
    container: node:22-bookworm
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
        working-directory: .
    env:
      VERSION: ${{ needs.version.outputs.version }}
      NAME: webpage-archiver
    steps:
      - uses: actions/checkout@v6
      - name: Build
        run: |
          npm ci
          npm run build
          # Zip the extension as Chrome loads it, and check the manifest's files are in it.
          python3 - <<'PY'
          import json, os, zipfile
          out = f"{os.environ['NAME']}-{os.environ['VERSION']}.zip"
          skip_dirs = {"node_modules", "tests", "docs", "test-results", "playwright-report", ".git", ".github"}
          skip_files = {"package.json", "package-lock.json", "build.js", ".gitignore", out}
          names = []
          with zipfile.ZipFile(out, "w", zipfile.ZIP_DEFLATED) as z:
              for root, dirs, files in os.walk("."):
                  dirs[:] = sorted(x for x in dirs if x not in skip_dirs)
                  for f in sorted(files):
                      path = os.path.relpath(os.path.join(root, f))
                      if f in skip_files or f.endswith(".zip") or (f.endswith(".md") and f != "LICENSE.md"):
                          continue
                      z.write(path, path)
                      names.append(path)
          m = json.load(open("manifest.json"))
          wanted = set()
          for icons in (m.get("icons") or {}, (m.get("action") or {}).get("default_icon") or {}):
              wanted.update(icons.values())
          wanted.update(filter(None, [(m.get("background") or {}).get("service_worker"),
                                      (m.get("action") or {}).get("default_popup"), m.get("options_page"),
                                      (m.get("options_ui") or {}).get("page")]))
          for cs in m.get("content_scripts") or []:
              wanted.update(cs.get("js", []) + cs.get("css", []))
          missing = sorted(w for w in wanted if w not in names)
          if missing:
              raise SystemExit(f"{out} lacks files the manifest names: {missing}")
          print(f"{out}: {len(names)} files")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: build-chrome-extension
          path: "*.zip"
          if-no-files-found: error

  publish:
    name: Publish the release
    needs: [version, build-chrome-extension]
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true
      - name: Create the release
        run: |
          cat > notes.md <<'NOTES'
          To install: download `webpage-archiver-{version}.zip`, unzip it, open `chrome://extensions`, turn on **Developer mode**, click **Load unpacked** and choose the unzipped folder.
          NOTES
          sed -i "s/{version}/$VERSION/g" notes.md
          ls -l assets
          gh release create "v$VERSION" assets/* --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" --title "v$VERSION" --notes-file notes.md --generate-notes
